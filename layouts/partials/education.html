{{ $entries := .education }}

{{ $delay := mul .index 120 }}
<details class="border-t-4 border-black group vertical-entry" style="animation-delay: {{ $delay }}ms;">
  <summary class="flex items-center justify-between cursor-pointer py-6 px-0 select-none list-none hover:bg-[#FFFF00] hover:px-4 transition-all">
    <span class="text-2xl md:text-3xl font-extrabold uppercase tracking-tight" style="font-family: var(--font-display);">
      Education
    </span>
    <span class="text-xs uppercase tracking-widest font-medium ml-4" style="font-family: var(--font-mono);">
      <span class="group-open:hidden">{{ len $entries }} institution{{ if ne (len $entries) 1 }}s{{ end }} &darr;</span>
      <span class="hidden group-open:inline">Collapse &uarr;</span>
    </span>
  </summary>

  <div class="pb-12">
    <div class="flex flex-col">
      {{ range $entries }}
      <div class="border-b-2 border-black py-6">
        <span class="text-xl font-extrabold uppercase tracking-tight" style="font-family: var(--font-display);">{{ .school }}</span>
        <span class="text-xs text-gray-500 ml-2 uppercase tracking-widest" style="font-family: var(--font-mono);">{{ .location }}</span>
        <p class="text-sm mt-1.5 text-gray-700" style="font-family: var(--font-mono);">{{ .degree }} &mdash; {{ .year }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</details>

{{ define "main" }}
<div class="border-b-4 border-black pb-10 mb-12">
  <h1 class="text-5xl md:text-7xl font-extrabold uppercase tracking-tight" style="font-family: var(--font-display);">{{ .Title }}</h1>
</div>

<div class="flex flex-col gap-0">
  {{ $page := . }}
  {{ range .Params.verticals }}
    {{ partial "portfolio-vertical.html" (dict "vertical" . "page" $page) }}
  {{ end }}
</div>
{{ end }}
